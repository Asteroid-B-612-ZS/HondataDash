plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.asteroidb612zs.hondatadash'
    compileSdk 33

    defaultConfig {
        applicationId "io.github.asteroidb612zs.hondatadash"
        minSdk 17
        targetSdk 28
        versionCode 58
        versionName "3.0.1-test.1"
    }

    lintOptions {
        abortOnError false
    }

    buildTypes {
        roadTest {
            initWith debug
            applicationIdSuffix ".test"
            // Separate installation: the offline V3 release key is not available to CI.
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // 零依赖 — 纯 Android Framework API
}
