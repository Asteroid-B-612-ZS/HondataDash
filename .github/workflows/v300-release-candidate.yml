name: V3.0 Release Candidate

on:
  push:
    branches:
      - release/v3.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V3 release branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android SDK 33
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2"
          test -f "$ANDROID_HOME/platforms/android-33/android.jar"

      - name: Verify V3 promotion and frozen production semantics
        run: |
          python3 tests/verify_v300_release.py
          python3 tests/verify_v201_release.py
          python3 tests/verify_api17_rc7.py
          python3 tests/verify_semantics_rc7.py
          python3 tests/verify_refinement.py --android-jar "$ANDROID_HOME/platforms/android-33/android.jar"

      - name: Restore pinned Roboto Condensed fonts
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets/fonts
          base='https://raw.githubusercontent.com/googlefonts/roboto-2/38062f4b4a0be4346d07a928408da21602545e9e/src/hinted'
          curl -fL "$base/RobotoCondensed-Regular.ttf" -o app/src/main/assets/fonts/RobotoCondensed-Regular.ttf
          curl -fL "$base/RobotoCondensed-Bold.ttf" -o app/src/main/assets/fonts/RobotoCondensed-Bold.ttf
          curl -fL "$base/RobotoCondensed-BoldItalic.ttf" -o app/src/main/assets/fonts/RobotoCondensed-BoldItalic.ttf

      - name: OEM visual and instrument regression
        run: |
          python3 tests/verify_oem.py
          python3 tests/verify_color_rc7.py
          python3 tests/verify_text_fit.py --fonts \
            app/src/main/assets/fonts/RobotoCondensed-Regular.ttf \
            app/src/main/assets/fonts/RobotoCondensed-Bold.ttf \
            app/src/main/assets/fonts/RobotoCondensed-BoldItalic.ttf
          python3 tests/verify_instruments.py --font app/src/main/assets/fonts/RobotoCondensed-Regular.ttf

      - name: Gradle unsigned release build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify unsigned V3 APK identity
        run: |
          set -euxo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$apk"
          test -s "$apk"
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/aapt" dump badging "$apk" | tee apk_badging.txt
          grep -q "package: name='io.github.asteroidb612zs.hondatadash'" apk_badging.txt
          grep -q "versionCode='57'" apk_badging.txt
          grep -q "versionName='3.0.0'" apk_badging.txt
          sha256sum "$apk" | tee apk_unsigned_sha256.txt
          cp "$apk" HondataDash_V3.0.0-unsigned.apk
          mkdir -p android-signing-tools/lib android-signing-tools/lib64
          cp "$bt/lib/apksigner.jar" android-signing-tools/lib/
          cp "$bt/zipalign" android-signing-tools/
          if [ -f "$bt/lib64/libc++.so" ]; then cp "$bt/lib64/libc++.so" android-signing-tools/lib64/; fi

      - name: Upload V3 unsigned candidate and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: HondataDash_V3.0.0_UNSIGNED
          path: |
            HondataDash_V3.0.0-unsigned.apk
            apk_badging.txt
            apk_unsigned_sha256.txt
            android-signing-tools/
          if-no-files-found: error
          retention-days: 30
