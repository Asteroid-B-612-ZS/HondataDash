name: IT2 Flight Recorder Build

on:
  push:
    branches:
      - internal/v2.0.1-it2
  pull_request:
    branches:
      - internal/v2.0.1-it1
      - internal/v2.0.1-it2
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout IT2
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify IT2 identity
        run: |
          grep -q 'versionCode 46' app/build.gradle
          grep -q 'versionName "2.0.1-internal.2"' app/build.gradle
          grep -q 'applicationId "io.github.asteroidb612zs.hondatadash.internal"' app/build.gradle
          grep -q 'Hondata Dash IT2' app/src/main/res/values/strings.xml

      - name: Install Android SDK 33
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2"
          test -f "$ANDROID_HOME/platforms/android-33/android.jar"

      - name: Restore pinned Roboto Condensed fonts
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets/fonts
          base='https://raw.githubusercontent.com/googlefonts/roboto-2/38062f4b4a0be4346d07a928408da21602545e9e/src/hinted'
          curl -fL "$base/RobotoCondensed-Regular.ttf" -o app/src/main/assets/fonts/RobotoCondensed-Regular.ttf
          curl -fL "$base/RobotoCondensed-Bold.ttf" -o app/src/main/assets/fonts/RobotoCondensed-Bold.ttf
          curl -fL "$base/RobotoCondensed-BoldItalic.ttf" -o app/src/main/assets/fonts/RobotoCondensed-BoldItalic.ttf
          test -s app/src/main/assets/fonts/RobotoCondensed-Regular.ttf
          test -s app/src/main/assets/fonts/RobotoCondensed-Bold.ttf
          test -s app/src/main/assets/fonts/RobotoCondensed-BoldItalic.ttf

      - name: IT2 observer-boundary QA
        run: |
          set -o pipefail
          python3 tests/verify_flight_recorder_it2.py 2>&1 | tee -a ci.log

      - name: Existing semantic and API17 QA
        run: |
          set -o pipefail
          {
            python3 tests/verify_api17_rc7.py
            if [ -f tests/verify_semantics_rc7.py ]; then python3 tests/verify_semantics_rc7.py; fi
            python3 tests/verify_refinement.py --android-jar "$ANDROID_HOME/platforms/android-33/android.jar"
          } 2>&1 | tee -a ci.log

      - name: Existing visual and instrument QA
        run: |
          if [ -f tests/verify_oem.py ]; then python3 tests/verify_oem.py; fi
          if [ -f tests/verify_text_fit.py ]; then
            python3 tests/verify_text_fit.py --fonts               app/src/main/assets/fonts/RobotoCondensed-Regular.ttf               app/src/main/assets/fonts/RobotoCondensed-Bold.ttf               app/src/main/assets/fonts/RobotoCondensed-BoldItalic.ttf
          fi
          if [ -f tests/verify_instruments.py ]; then
            python3 tests/verify_instruments.py --font app/src/main/assets/fonts/RobotoCondensed-Regular.ttf
          fi

      - name: Gradle release build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease 2>&1 | tee -a ci.log

      - name: Verify APK identity and signature
        run: |
          set -euxo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/aapt" dump badging "$apk" | tee apk_badging.txt
          grep -q "package: name='io.github.asteroidb612zs.hondatadash.internal'" apk_badging.txt
          grep -q "versionCode='46'" apk_badging.txt
          grep -q "versionName='2.0.1-internal.2'" apk_badging.txt
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee apk_signature.txt
          sha256sum "$apk" | tee apk_sha256.txt
          cp "$apk" HondataDash_V2.0.1-internal.2.apk

      - name: Upload IT2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HondataDash_V2.0.1-internal.2
          path: |
            HondataDash_V2.0.1-internal.2.apk
            apk_badging.txt
            apk_signature.txt
            apk_sha256.txt
          if-no-files-found: error


      - name: Report IT2 CI result to draft PR
        if: always() && github.ref == 'refs/heads/internal/v2.0.1-it2'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          sha_line="APK SHA: not produced"
          if [ -f apk_sha256.txt ]; then sha_line="$(cat apk_sha256.txt)"; fi
          tail_text="No ci.log output."
          if [ -f ci.log ]; then tail_text="$(tail -n 35 ci.log)"; fi
          printf -v body 'IT2 CI push `%s`: **%s**\n\nRun ID: `%s`\n\n%s\n\nLast log lines:\n```text\n%s\n```' "$GITHUB_SHA" "$JOB_STATUS" "$GITHUB_RUN_ID" "$sha_line" "$tail_text"
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body "$body"
