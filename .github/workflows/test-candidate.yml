name: Test Candidate

on:
  pull_request:
  push:
    branches:
      - fix/dashboard-auto-night
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK and restore pinned fonts
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2"
          curl -fsSL https://dl.google.com/android/repository/android-17_r03.zip -o /tmp/api17.zip
          unzip -q /tmp/api17.zip -d /tmp/api17
          base='https://raw.githubusercontent.com/googlefonts/roboto-2/38062f4b4a0be4346d07a928408da21602545e9e/src/hinted'
          for face in Regular Bold BoldItalic; do
            curl -fsSL "$base/RobotoCondensed-$face.ttf" -o "app/src/main/assets/fonts/RobotoCondensed-$face.ttf"
          done
      - name: Verify candidate and preserved production contracts
        run: |
          set -euo pipefail
          python3 tests/verify_v301_test.py
          python3 tests/verify_v201_release.py
          python3 tests/verify_api17_rc7.py
          python3 tests/verify_semantics_rc7.py
          python3 tests/verify_refinement.py --android-jar /tmp/api17/android-4.2.2/android.jar
          python3 tests/verify_oem.py
          python3 tests/verify_color_rc7.py
          python3 tests/verify_text_fit.py --fonts app/src/main/assets/fonts/RobotoCondensed-Regular.ttf app/src/main/assets/fonts/RobotoCondensed-Bold.ttf app/src/main/assets/fonts/RobotoCondensed-BoldItalic.ttf
          python3 tests/verify_instruments.py --font app/src/main/assets/fonts/RobotoCondensed-Regular.ttf
      - name: Build separately installable test APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRoadTest
      - name: Verify test package and signature
        run: |
          set -euo pipefail
          mkdir -p test-artifact
          cp app/build/outputs/apk/roadTest/app-roadTest.apk test-artifact/HondataDash-3.0.1-test.1.apk
          apk=test-artifact/HondataDash-3.0.1-test.1.apk
          "$ANDROID_HOME/build-tools/33.0.2/aapt" dump badging "$apk" > test-artifact/apk-badging.txt
          grep -q "package: name='io.github.asteroidb612zs.hondatadash.test'" test-artifact/apk-badging.txt
          grep -q "versionCode='58'" test-artifact/apk-badging.txt
          grep -q "versionName='3.0.1-test.1'" test-artifact/apk-badging.txt
          grep -q "sdkVersion:'17'" test-artifact/apk-badging.txt
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --verbose --print-certs "$apk" > test-artifact/signature.txt
          "$ANDROID_HOME/build-tools/33.0.2/zipalign" -c 4 "$apk"
          sha256sum "$apk" > test-artifact/SHA256SUMS.txt
          git rev-parse HEAD > test-artifact/source-commit.txt
          cp docs/V3.0.1_TEST1.md test-artifact/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: HondataDash-3.0.1-test.1
          path: test-artifact/
          if-no-files-found: error
          retention-days: 30
