name: Publish V3.0.0

on:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout final source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact V3 release identity
        id: guard
        run: |
          set -euxo pipefail
          grep -q 'versionCode 57' app/build.gradle
          grep -q 'versionName "3.0.0"' app/build.gradle
          python3 tests/verify_v300_release.py
          if gh release view v3.0.0 >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "v3.0.0 already published; publish/cleanup steps will be skipped."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Archive historical branch heads as tags
        if: steps.guard.outputs.already_published != 'true'
        run: |
          set -euxo pipefail
          archive_branch() {
            branch="$1"
            tag="$2"
            sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
            if [ -n "$sha" ]; then
              if ! git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
                git tag "$tag" "$sha"
                git push origin "refs/tags/$tag"
              fi
            fi
          }
          archive_branch "release/v2.0.1" "archive/v2.0.1-production"
          archive_branch "internal/v2.0.1-diagnostic" "archive/v2.0.1-diagnostic"
          archive_branch "feature/v2.1-oem-color" "archive/v2.1.0-oem-color"
          archive_branch "feature/v2.1-oem-refinement" "archive/v2.1-oem-refinement"
          archive_branch "stability/v2.1.1-final-candidate" "archive/v2.1.1-road-tested"

      - name: Tag and publish V3.0.0
        if: steps.guard.outputs.already_published != 'true'
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code origin refs/tags/v3.0.0 >/dev/null 2>&1; then
            git tag -a v3.0.0 "$GITHUB_SHA" -m "HondataDash V3.0.0"
            git push origin refs/tags/v3.0.0
          fi
          gh release create v3.0.0 \
            release/V3.0_CHECKSUMS.txt \
            --title "HondataDash V3.0.0" \
            --notes-file docs/V3.0_RELEASE_NOTES.md \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove obsolete development branches
        run: |
          set -euxo pipefail
          for branch in \
            feature/v2.1-oem-color \
            feature/v2.1-oem-refinement \
            internal/v2.0.1-diagnostic \
            release/v2.0.1 \
            stability/v2.1.1-final-candidate \
            release/v3.0.0 \
            release-assets/v3.0.0 \
            release/v3.0-publish-finalize \
            release/v3-cleanup
          do
            if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Remove obsolete Actions artifacts
        run: |
          set -euo pipefail
          ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' || true)"
          for id in $ids; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
